<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جامع الشقيحي - نظام الحلقات</title>

    <!-- أيقونة التاب (Favicon) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕌</text></svg>">

    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-emerald: #10b981;
            --primary-glow: #34d399;
            --bg-gradient: radial-gradient(circle at center, #1b4d3e 0%, #0d2921 70%, #081a15 100%);
            --card-bg: rgba(16, 44, 36, 0.75);
            --card-border: rgba(52, 211, 153, 0.2);
            --text-main: #ffffff;
            --text-muted: #a7f3d0;
            --present: #10b981;
            --absent: #ef4444;
            --excused: #f59e0b;
            --unmarked: #64748b;
            --transition-smooth: cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        
        body { 
            background: var(--bg-gradient); 
            color: var(--text-main); 
            min-height: 100vh; 
            padding: 1rem;
            overflow-x: hidden;
        }

        /* شريط علوي يطابق التصميم */
        .top-navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 31, 25, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            padding: 0.7rem 1.5rem;
            border-radius: 16px;
            margin-bottom: 1.5rem;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            font-weight: 800;
            font-size: 1.1rem;
            color: var(--primary-glow);
        }

        .nav-info {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: 0.9rem;
        }

        .badge-date {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid var(--card-border);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            color: var(--text-muted);
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes slideInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .container { 
            max-width: 1000px; 
            margin: 0 auto; 
            animation: slideInUp 0.5s var(--transition-smooth);
        }

        .portal-overlay { 
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; 
            background: var(--bg-gradient);
            display: flex; justify-content: center; align-items: center; 
            z-index: 999; padding: 1rem; 
        }

        .portal-card { 
            background: var(--card-bg); 
            border: 1px solid var(--card-border); 
            backdrop-filter: blur(16px);
            border-radius: 28px; 
            padding: 2.5rem 2rem; 
            text-align: center; 
            max-width: 480px; width: 100%; 
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6); 
            animation: fadeInScale 0.4s var(--transition-smooth);
        }

        .mosque-icon-box {
            width: 80px;
            height: 80px;
            background: rgba(16, 185, 129, 0.15);
            border: 2px solid var(--primary-glow);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.2rem auto;
            font-size: 2.5rem;
            color: var(--primary-glow);
        }

        .portal-card h2 { font-size: 2rem; color: #fff; margin-bottom: 0.3rem; font-weight: 800; }
        .portal-card p { color: var(--text-muted); margin-bottom: 1.8rem; font-size: 0.95rem; }
        
        .portal-btns { display: flex; flex-direction: column; gap: 1rem; }
        
        .portal-btn { 
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid var(--card-border); 
            color: #fff; 
            padding: 1.1rem 1.4rem; 
            border-radius: 18px; 
            font-size: 1.05rem; 
            font-weight: 700; 
            cursor: pointer; 
            transition: all 0.25s var(--transition-smooth); 
            display: flex; align-items: center; justify-content: space-between;
        }

        .portal-btn:hover { 
            background: rgba(16, 185, 129, 0.25); 
            border-color: var(--primary-glow); 
            transform: translateY(-3px); 
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.2);
        }

        .custom-input, select { 
            width: 100%; 
            background: rgba(8, 26, 21, 0.8); 
            border: 1px solid var(--card-border); 
            padding: 0.85rem 1rem; 
            border-radius: 12px; 
            color: #fff; 
            font-size: 1rem; 
            outline: none; 
            margin-top: 0.5rem; 
            text-align: center;
            transition: all 0.25s ease;
        }

        .custom-input:focus, select:focus {
            border-color: var(--primary-glow);
            box-shadow: 0 0 15px rgba(52, 211, 153, 0.3);
        }

        .hidden { display: none !important; }

        .page-header {
            text-align: center;
            margin-bottom: 1.8rem;
        }

        .page-header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 0.5rem;
        }

        .controls-card { 
            background: var(--card-bg); 
            border: 1px solid var(--card-border); 
            backdrop-filter: blur(12px);
            padding: 1.2rem; 
            border-radius: 20px; 
            margin-bottom: 1.5rem; 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); 
            gap: 1rem; 
        }

        .control-group label { font-size: 0.85rem; color: var(--text-muted); font-weight: 700; display: block; margin-bottom: 0.3rem; }

        .days-bar { 
            display: flex; gap: 0.6rem; justify-content: center; margin-bottom: 1.5rem; flex-wrap: wrap; 
            background: var(--card-bg); padding: 0.8rem; border-radius: 20px; border: 1px solid var(--card-border); 
        }

        .day-btn { 
            background: rgba(255,255,255,0.05); 
            border: 1px solid var(--card-border); 
            color: var(--text-main); 
            padding: 0.6rem 1.4rem; 
            border-radius: 12px; 
            cursor: pointer; 
            font-weight: 700; 
            transition: all 0.25s var(--transition-smooth); 
        }

        .day-btn:hover { background: rgba(52, 211, 153, 0.15); transform: translateY(-2px); }
        .day-btn.active { 
            background: var(--primary-emerald); 
            border-color: var(--primary-glow); 
            color: white; 
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4); 
        }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 0.9rem; margin-bottom: 1.5rem; }
        .stat-card { 
            background: var(--card-bg); 
            border: 1px solid var(--card-border); 
            padding: 1rem; 
            border-radius: 16px; 
            text-align: center; 
        }
        .stat-card h3 { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.4rem; }
        .stat-card .count { font-size: 1.6rem; font-weight: 800; }

        .add-student-box { 
            background: var(--card-bg); 
            border: 1px solid var(--card-border); 
            padding: 0.9rem; 
            border-radius: 16px; 
            margin-bottom: 1.5rem; 
            display: flex; gap: 0.8rem; 
        }

        .add-student-box input { 
            flex: 1; 
            background: rgba(8, 26, 21, 0.6); 
            border: 1px solid var(--card-border); 
            padding: 0.8rem 1.2rem; 
            border-radius: 10px; 
            color: #fff; 
            outline: none; 
            font-size: 1rem; 
        }

        .add-student-box button { 
            background: var(--primary-emerald); 
            color: white; 
            border: none; 
            padding: 0.8rem 1.5rem; 
            border-radius: 10px; 
            cursor: pointer; 
            font-weight: 700; 
            transition: all 0.2s ease; 
        }

        .add-student-box button:hover { background: #059669; transform: translateY(-2px); }

        .students-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); 
            gap: 1rem; 
        }
        
        .student-card { 
            background: var(--card-bg); 
            border: 1px solid var(--card-border); 
            padding: 1.2rem; 
            border-radius: 18px; 
            display: flex; flex-direction: column; justify-content: space-between; gap: 1rem; 
            transition: all 0.25s var(--transition-smooth);
            position: relative;
        }

        .student-card:hover { 
            border-color: var(--primary-glow); 
            transform: translateY(-3px); 
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3); 
        }

        .student-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .student-name { font-size: 1.15rem; font-weight: 800; color: #fff; cursor: pointer; }
        .student-name:hover { color: var(--primary-glow); }

        .attendance-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.4rem; }
        .status-btn { 
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid var(--card-border); 
            color: var(--text-main); 
            padding: 0.5rem 0.3rem; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 0.8rem; 
            font-weight: 700; 
            text-align: center;
            transition: all 0.2s ease; 
        }
        
        .status-btn.present.active { background: var(--present); border-color: var(--present); color: white; }
        .status-btn.absent.active { background: var(--absent); border-color: var(--absent); color: white; }
        .status-btn.excused.active { background: var(--excused); border-color: var(--excused); color: white; }
        .status-btn.unmarked.active { background: var(--unmarked); border-color: var(--unmarked); color: white; }

        .modal-box { 
            background: var(--card-bg); 
            border: 1px solid var(--card-border); 
            border-radius: 24px; 
            padding: 2rem; 
            width: 90%; 
            max-width: 420px; 
            text-align: center; 
        }

        .action-bar { display: flex; justify-content: space-between; align-items: center; gap: 0.8rem; margin-bottom: 1.2rem; flex-wrap: wrap; }
    </style>
</head>
<body>

    <!-- Portal Selection Overlay -->
    <div class="portal-overlay" id="portal-modal">
        <div class="portal-card">
            <div class="mosque-icon-box">🕌</div>
            <h2>جامع الشقيحي</h2>
            <p>نظام تحضير الحلقات القرآنية</p>

            <!-- الشاشة الأولى: اختيار نوع الدخول -->
            <div id="portal-main" class="portal-btns">
                <button class="portal-btn" onclick="showPasscodeForm()">
                    <span><i class="fa-solid fa-chalkboard-user"></i> دخول المحضر / المسمّع</span>
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
                <button class="portal-btn" onclick="showStudentSearchForm()">
                    <span><i class="fa-solid fa-user-graduate"></i> الطالب / ولي الأمر</span>
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
            </div>

            <!-- الشاشة الثانية: رمز المرور -->
            <div id="passcode-form" class="hidden">
                <p>أدخل رمز دخول المحضر:</p>
                <input type="tel" id="passcode-input" class="custom-input" placeholder="••••••" maxlength="6" inputmode="numeric">
                <div style="display:flex; gap:0.8rem; margin-top:1.5rem;">
                    <button class="portal-btn" style="flex:1; justify-content:center; background:var(--primary-emerald);" onclick="verifyPasscode()">دخول</button>
                    <button class="portal-btn" style="flex:1; justify-content:center;" onclick="resetPortal()">إلغاء</button>
                </div>
            </div>

            <!-- الشاشة الثالثة: اختيار الحلقة -->
            <div id="ring-selection-form" class="hidden">
                <h3 style="margin-bottom: 1.2rem; color: #fff;">اختر الحلقة للتحضير</h3>
                <div class="portal-btns">
                    <button class="portal-btn" onclick="selectRing('omar', 'حلقة عمر بن الخطاب')">
                        <span><i class="fa-solid fa-book-quran"></i> حلقة عمر بن الخطاب</span>
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>
                    <button class="portal-btn" onclick="selectRing('bilal', 'حلقة بلال بن رباح')">
                        <span><i class="fa-solid fa-book-quran"></i> حلقة بلال بن رباح</span>
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>
                    <button class="portal-btn" onclick="selectRing('saad', 'حلقة سعد بن أبي وقاص')">
                        <span><i class="fa-solid fa-book-quran"></i> حلقة سعد بن أبي وقاص</span>
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>
                </div>
            </div>

            <!-- بحث الطلاب -->
            <div id="student-search-form" class="hidden">
                <p>ابحث باسم الطالب لعرض التقرير:</p>
                <input type="text" id="search-name-input" class="custom-input" placeholder="اسم الطالب...">
                <div style="display:flex; gap:0.8rem; margin-top:1.5rem;">
                    <button class="portal-btn" style="flex:1; justify-content:center; background:var(--primary-emerald);" onclick="searchStudent()">بحث</button>
                    <button class="portal-btn" style="flex:1; justify-content:center;" onclick="resetPortal()">إلغاء</button>
                </div>
                <div id="student-result"></div>
            </div>
        </div>
    </div>

    <!-- Modal السبب -->
    <div class="portal-overlay hidden" id="reason-modal">
        <div class="modal-box">
            <h3>سبب الاستئذان</h3>
            <input type="text" id="reason-input" class="custom-input" placeholder="اكتب السبب هنا...">
            <div style="display:flex; gap:0.8rem; margin-top:1.5rem;">
                <button class="portal-btn" style="flex:1; justify-content:center; background:var(--primary-emerald);" onclick="confirmExcused()">حفظ</button>
                <button class="portal-btn" style="flex:1; justify-content:center;" onclick="closeReasonModal()">تخطي</button>
            </div>
        </div>
    </div>

    <!-- Admin View -->
    <div class="container hidden" id="admin-view">
        
        <!-- Navbar -->
        <div class="top-navbar">
            <div class="nav-brand">
                <span>🕌</span>
                <span>جامع الشقيحي</span>
            </div>
            <div class="nav-info">
                <span class="badge-date" id="nav-ring-display">حلقة عمر بن الخطاب</span>
                <button class="portal-btn" style="padding: 0.4rem 0.8rem; font-size:0.85rem;" onclick="logout()">خروج <i class="fa-solid fa-right-from-bracket"></i></button>
            </div>
        </div>

        <div class="page-header">
            <h1>معلومات وإحصائيات الطلاب</h1>
        </div>

        <!-- Controls Selection -->
        <div class="controls-card">
            <div class="control-group">
                <label>السنة الهجرية</label>
                <select id="year-select" onchange="onControlChange()">
                    <option value="1448">1448 هـ</option>
                    <option value="1449">1449 هـ</option>
                </select>
            </div>
            <div class="control-group">
                <label>الشهر الهجري</label>
                <select id="month-select" onchange="onControlChange()">
                    <option value="1">محرم</option>
                    <option value="2">صفر</option>
                    <option value="3" selected>ربيع الأول</option>
                    <option value="4">ربيع الآخر</option>
                    <option value="5">جمادى الأولى</option>
                    <option value="6">جمادى الآخرة</option>
                    <option value="7">رجب</option>
                    <option value="8">شعبان</option>
                    <option value="9">رمضان</option>
                    <option value="10">شوال</option>
                    <option value="11">ذو القعدة</option>
                    <option value="12">ذو الحجة</option>
                </select>
            </div>
            <div class="control-group">
                <label>الأسبوع</label>
                <select id="week-select" onchange="onControlChange()">
                    <option value="1">الأسبوع الأول</option>
                    <option value="2" selected>الأسبوع الثاني</option>
                    <option value="3">الأسبوع الثالث</option>
                    <option value="4">الأسبوع الرابع</option>
                </select>
            </div>
        </div>

        <!-- Days Selector Bar -->
        <div class="days-bar">
            <button class="day-btn" onclick="switchDay('الأحد')">الأحد</button>
            <button class="day-btn active" onclick="switchDay('الاثنين')">الاثنين</button>
            <button class="day-btn" onclick="switchDay('الثلاثاء')">الثلاثاء</button>
            <button class="day-btn" onclick="switchDay('الأربعاء')">الأربعاء</button>
            <button class="day-btn" onclick="switchDay('الخميس')">الخميس</button>
        </div>

        <!-- Stats Grid -->
        <div class="stats-grid">
            <div class="stat-card"><h3>إجمالي الطلاب</h3><div class="count" id="total-count">0</div></div>
            <div class="stat-card"><h3>الحاضرون</h3><div class="count" style="color: var(--present);" id="present-count">0</div></div>
            <div class="stat-card"><h3>الغائبون</h3><div class="count" style="color: var(--absent);" id="absent-count">0</div></div>
            <div class="stat-card"><h3>المستأذنون</h3><div class="count" style="color: var(--excused);" id="excused-count">0</div></div>
            <div class="stat-card"><h3>لم يتم التحضير</h3><div class="count" style="color: var(--unmarked);" id="unmarked-count">0</div></div>
        </div>

        <!-- حقل إضافة طالب مع إبقاء التركيز والإنتر -->
        <div class="add-student-box">
            <input type="text" id="student-name-input" placeholder="أدخل اسم الطالب واضغط Enter لإضافته..." onkeydown="handleInputKeyDown(event)">
            <button onclick="addStudent()"><i class="fa-solid fa-plus"></i> إضافة</button>
        </div>

        <div class="action-bar">
            <div style="display:flex; gap:0.5rem;">
                <button class="portal-btn" style="padding:0.5rem 1rem; font-size:0.85rem; background:rgba(16,185,129,0.2);" onclick="setAllPresent()">تحضير الكل "حاضر"</button>
                <button class="portal-btn" style="padding:0.5rem 1rem; font-size:0.85rem;" onclick="setAllUnmarked()">إعادة ضبط الكل</button>
            </div>
            <button class="portal-btn" style="padding:0.5rem 1rem; font-size:0.85rem;" onclick="backToRings()">تغيير الحلقة</button>
        </div>

        <div class="students-grid" id="students-container"></div>
    </div>

    <script>
        let currentDay = 'الاثنين';
        let currentRing = 'omar';
        let allStudents = [];
        let activeStudentForReason = null;

        window.onload = () => {
            const role = localStorage.getItem('portal_role');
            const savedRing = localStorage.getItem('portal_ring');
            const savedRingName = localStorage.getItem('portal_ring_name');

            if (role === 'admin' && savedRing) {
                currentRing = savedRing;
                document.getElementById('nav-ring-display').innerText = savedRingName || 'الحلقة المختارة';
                document.getElementById('portal-modal').classList.add('hidden');
                document.getElementById('admin-view').classList.remove('hidden');
                loadStudents();
            }
        };

        function handleInputKeyDown(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                addStudent();
            }
        }

        function getSelectedPeriod() {
            return {
                year: document.getElementById('year-select').value,
                month: document.getElementById('month-select').value,
                week: document.getElementById('week-select').value
            };
        }

        function onControlChange() {
            loadStudents();
        }

        async function loadStudents() {
            try {
                const { year, month, week } = getSelectedPeriod();
                const res = await fetch(`/api/students?day=${currentDay}&year=${year}&month=${month}&week=${week}`);
                allStudents = await res.json();
                render();
            } catch (err) { console.error('خطأ في البيانات:', err); }
        }

        function switchDay(dayName) {
            currentDay = dayName;
            document.querySelectorAll('.day-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText.trim() === dayName);
            });
            loadStudents();
        }

        function showPasscodeForm() {
            document.getElementById('portal-main').classList.add('hidden');
            document.getElementById('passcode-form').classList.remove('hidden');
        }

        function showStudentSearchForm() {
            document.getElementById('portal-main').classList.add('hidden');
            document.getElementById('student-search-form').classList.remove('hidden');
        }

        function resetPortal() {
            document.getElementById('passcode-form').classList.add('hidden');
            document.getElementById('ring-selection-form').classList.add('hidden');
            document.getElementById('student-search-form').classList.add('hidden');
            document.getElementById('portal-main').classList.remove('hidden');
        }

        function verifyPasscode() {
            if (document.getElementById('passcode-input').value === '282834') {
                localStorage.setItem('portal_role', 'admin');
                document.getElementById('passcode-form').classList.add('hidden');
                document.getElementById('ring-selection-form').classList.remove('hidden');
            } else alert('الرمز غير صحيح!');
        }

        function selectRing(ringKey, ringDisplayName) {
            currentRing = ringKey;
            localStorage.setItem('portal_ring', ringKey);
            localStorage.setItem('portal_ring_name', ringDisplayName);
            document.getElementById('nav-ring-display').innerText = ringDisplayName;
            document.getElementById('portal-modal').classList.add('hidden');
            document.getElementById('admin-view').classList.remove('hidden');
            loadStudents();
        }

        function backToRings() {
            document.getElementById('admin-view').classList.add('hidden');
            document.getElementById('portal-modal').classList.remove('hidden');
            document.getElementById('ring-selection-form').classList.remove('hidden');
        }

        function logout() {
            localStorage.removeItem('portal_role');
            localStorage.removeItem('portal_ring');
            localStorage.removeItem('portal_ring_name');
            location.reload();
        }

        async function addStudent() {
            const inputField = document.getElementById('student-name-input');
            const name = inputField.value.trim();
            if (!name) return;

            const { year, month, week } = getSelectedPeriod();
            await fetch('/api/students', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, ring: currentRing, day: currentDay, year, month, week })
            });

            inputField.value = '';
            inputField.focus();
            loadStudents();
        }

        async function setStatus(studentId, status, reason = '') {
            if (status === 'excused' && reason === '') {
                activeStudentForReason = studentId;
                document.getElementById('reason-modal').classList.remove('hidden');
                return;
            }

            const { year, month, week } = getSelectedPeriod();
            await fetch('/api/attendance', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ student_id: studentId, day: currentDay, year, month, week, status, reason })
            });
            loadStudents();
        }

        function confirmExcused() {
            const reason = document.getElementById('reason-input').value.trim();
            document.getElementById('reason-modal').classList.add('hidden');
            document.getElementById('reason-input').value = '';
            setStatus(activeStudentForReason, 'excused', reason || 'بدون سبب');
        }

        function closeReasonModal() {
            document.getElementById('reason-modal').classList.add('hidden');
            setStatus(activeStudentForReason, 'excused', 'بدون سبب');
        }

        async function setAllPresent() {
            const { year, month, week } = getSelectedPeriod();
            await fetch('/api/attendance/all-status', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ring: currentRing, day: currentDay, year, month, week, status: 'present' })
            });
            loadStudents();
        }

        async function setAllUnmarked() {
            const { year, month, week } = getSelectedPeriod();
            await fetch('/api/attendance/all-status', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ring: currentRing, day: currentDay, year, month, week, status: 'unmarked' })
            });
            loadStudents();
        }

        async function deleteStudent(id) {
            if (!confirm('هل تريد حذف الطالب؟')) return;
            await fetch(`/api/students/${id}`, { method: 'DELETE' });
            loadStudents();
        }

        function render() {
            const container = document.getElementById('students-container');
            container.innerHTML = '';
            const filtered = allStudents.filter(s => s.ring === currentRing);

            filtered.forEach(student => {
                const card = document.createElement('div');
                card.className = 'student-card';
                card.innerHTML = `
                    <div class="student-header">
                        <span class="student-name">${student.name}</span>
                        <button onclick="deleteStudent(${student.id})" style="background:none; border:none; color:var(--absent); cursor:pointer;"><i class="fa-solid fa-trash"></i></button>
                    </div>
                    <div class="attendance-btns">
                        <button class="status-btn present ${student.status === 'present' ? 'active' : ''}" onclick="setStatus(${student.id}, 'present')">حاضر</button>
                        <button class="status-btn absent ${student.status === 'absent' ? 'active' : ''}" onclick="setStatus(${student.id}, 'absent')">غائب</button>
                        <button class="status-btn excused ${student.status === 'excused' ? 'active' : ''}" onclick="setStatus(${student.id}, 'excused')">مستأذن</button>
                        <button class="status-btn unmarked ${student.status === 'unmarked' ? 'active' : ''}" onclick="setStatus(${student.id}, 'unmarked')">لم يحدد</button>
                    </div>
                `;
                container.appendChild(card);
            });

            document.getElementById('total-count').innerText = filtered.length;
            document.getElementById('present-count').innerText = filtered.filter(s => s.status === 'present').length;
            document.getElementById('absent-count').innerText = filtered.filter(s => s.status === 'absent').length;
            document.getElementById('excused-count').innerText = filtered.filter(s => s.status === 'excused').length;
            document.getElementById('unmarked-count').innerText = filtered.filter(s => s.status === 'unmarked').length;
        }
    </script>
</body>
</html>
